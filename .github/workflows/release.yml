name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push the container image to GHCR

env:
  ZIG_VERSION: "0.16.0"
  # Pinned upstream SHA256 (x86_64-linux), see https://ziglang.org/download/index.json
  ZIG_SHA256_X86_64: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  guard:
    name: Verify tag matches build.zig.zon version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert git tag == build.zig.zon .version
        run: |
          set -euo pipefail
          zon_ver=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "build.zig.zon version = ${zon_ver}"
          echo "git tag             = ${GITHUB_REF_NAME} (-> ${tag_ver})"
          if [ -z "$zon_ver" ]; then
            echo "ERROR: could not parse .version from build.zig.zon" >&2; exit 1
          fi
          if [ "$zon_ver" != "$tag_ver" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match build.zig.zon version ${zon_ver}." >&2
            echo "Bump .version in build.zig.zon to ${tag_ver} before tagging (see AGENT.md §6)." >&2
            exit 1
          fi

  release-gate:
    name: Release gate (privileged netns e2e — issue #26)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256_X86_64}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Load tun module
        run: sudo modprobe tun

      # SUBNETRA_RELEASE_GATE=1 makes any SKIP a HARD FAILURE: the release is only
      # certified if the live privileged netns relay e2e actually runs and passes.
      # Evidence is appended to the job summary by the harness.
      - name: Run privileged release gate
        run: |
          sudo --preserve-env=PATH,SUBNETRA_RELEASE_GATE,GITHUB_STEP_SUMMARY \
            env "PATH=$PATH" SUBNETRA_RELEASE_GATE=1 \
            bash test/integration/run.sh

  binaries:
    name: Build static binaries (${{ matrix.arch }})
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-musl
            cpu: ""
          - arch: arm64
            target: aarch64-linux-musl
            cpu: ""
          - arch: armv7
            target: arm-linux-musleabihf
            cpu: "generic+v7a"
          - arch: armv5
            target: arm-linux-musleabi
            cpu: "arm926ej_s"
          - arch: mipsel
            target: mipsel-linux-musl
            cpu: ""
          - arch: mips
            target: mips-linux-musl
            cpu: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256_X86_64}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Cross-build static musl binaries (ReleaseSmall)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          size_budget=524288   # 512 KiB, iron law #6
          cpu_arg=""
          if [ -n "${{ matrix.cpu }}" ]; then cpu_arg="-Dcpu=${{ matrix.cpu }}"; fi
          zig build -Dtarget="${{ matrix.target }}" $cpu_arg -Doptimize=ReleaseSmall
          for bin in subnetrad subnetra; do
            path="zig-out/bin/${bin}"
            # Iron law #6: each artifact must be static and within budget.
            if readelf -d "$path" 2>/dev/null | grep -q NEEDED; then
              echo "ERROR: ${path} (${{ matrix.target }}) is dynamically linked" >&2
              exit 1
            fi
            size=$(stat -c%s "$path")
            echo "${bin} (${{ matrix.arch }}): ${size} bytes"
            if [ "$size" -gt "$size_budget" ]; then
              echo "ERROR: ${path} ${size} bytes exceeds ${size_budget} budget" >&2
              exit 1
            fi
          done
          stage="subnetra-${version}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$stage"
          cp zig-out/bin/subnetrad zig-out/bin/subnetra "dist/$stage/"
          cp config.example.json README.md LICENSE "dist/$stage/"
          cp deploy/subnetrad.service "dist/$stage/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "dist/$stage"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: subnetra-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  macos-binaries:
    name: Build macOS binaries (${{ matrix.arch }})
    # Zig cross-compiles a Mach-O that links only libSystem (Apple ships no static
    # libc), so no macOS runner or SDK is needed — Zig's bundled libc stubs suffice.
    # Iron law #6 (macOS amendment): minimal-dynamic, libSystem-only, with its own
    # recorded size baseline; the static/ldd gate stays Linux-only.
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-macos
          - arch: amd64
            target: x86_64-macos
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256_X86_64}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Cross-build macOS binaries (ReleaseSmall)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          zig build -Dtarget="${{ matrix.target }}" -Doptimize=ReleaseSmall
          for bin in subnetrad subnetra; do
            path="zig-out/bin/${bin}"
            # Sanity: a Mach-O for this arch, not a stray host build.
            if ! file "$path" | grep -q "Mach-O"; then
              echo "ERROR: ${path} is not a Mach-O binary" >&2; file "$path"; exit 1
            fi
            # Iron law #6 (macOS): no static/budget gate — record the size baseline.
            # Zero third-party deps (iron law #1) ⇒ libSystem-only, verified by the
            # acceptance runbook's `otool -L` on a real Mac.
            echo "${bin} (macos-${{ matrix.arch }}): $(stat -c%s "$path") bytes"
          done
          stage="subnetra-${version}-macos-${{ matrix.arch }}"
          mkdir -p "dist/$stage"
          cp zig-out/bin/subnetrad zig-out/bin/subnetra "dist/$stage/"
          cp config.example.json README.md LICENSE "dist/$stage/"
          cp deploy/net.subnetra.subnetrad.plist "dist/$stage/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "dist/$stage"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: subnetra-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [binaries, macos-binaries, image, release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect assets + combined checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS.txt )
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "Subnetra ${VERSION}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS.txt

  image:
    name: Build + push multi-arch image (GHCR)
    needs: [binaries, release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve lowercase image name
        id: img
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/subnetra" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Multi-platform output needs the docker-container buildx driver. No qemu
      # is required: the Dockerfile build stage is pinned to BUILDPLATFORM and
      # Zig cross-compiles, while the final busybox stage only copies files.
      - name: Set up buildx (docker-container driver)
        run: |
          set -euo pipefail
          docker buildx create --name btbuilder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # busybox:musl publishes amd64, arm64 and arm/v7 — push those three as one
      # manifest list to an intermediate tag. arm/v5 is built separately below
      # (busybox:musl has no arm/v5), then both are stitched into :version/:latest.
      - name: Build and push busybox/musl image (amd64, arm64, arm/v7)
        run: |
          set -euo pipefail
          image="${{ steps.img.outputs.image }}"
          version="${{ steps.img.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --provenance=false \
            --tag "${image}:${version}-musl3" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${version}" \
            --push \
            .

      # arm/v5 INDEPENDENT build: no musl busybox publishes arm/v5, and musl is
      # mandatory, so this arch ships on a musl-pure `scratch` base (static binary
      # only, no debug shell). RUNTIME_BASE=scratch overrides the Dockerfile default.
      - name: Build and push arm/v5 image (independent, scratch base)
        run: |
          set -euo pipefail
          image="${{ steps.img.outputs.image }}"
          version="${{ steps.img.outputs.version }}"
          docker buildx build \
            --platform linux/arm/v5 \
            --provenance=false \
            --build-arg RUNTIME_BASE=scratch \
            --tag "${image}:${version}-armv5" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${version}" \
            --push \
            .

      # Stitch the 3-arch musl list and the independent arm/v5 image into the
      # single user-facing :version and :latest manifest lists spanning all four
      # architectures.
      - name: Assemble unified multi-arch manifest (:version, :latest)
        run: |
          set -euo pipefail
          image="${{ steps.img.outputs.image }}"
          version="${{ steps.img.outputs.version }}"
          for tag in "${version}" latest; do
            docker buildx imagetools create \
              --tag "${image}:${tag}" \
              "${image}:${version}-musl3" \
              "${image}:${version}-armv5"
          done
          docker buildx imagetools inspect "${image}:${version}"

      # Air-gapped / registry-less devices: export each arch as a standalone
      # `docker load`-able archive. Built from the same buildx cache as the push
      # above, so the contents are identical to the published per-arch image.
      - name: Export per-arch offline image tarballs
        run: |
          set -euo pipefail
          image="${{ steps.img.outputs.image }}"
          version="${{ steps.img.outputs.version }}"
          mkdir -p images
          for entry in "amd64:linux/amd64:" "arm64:linux/arm64:" "armv7:linux/arm/v7:" "armv5:linux/arm/v5:scratch"; do
            arch="${entry%%:*}"; rest="${entry#*:}"; plat="${rest%%:*}"; base="${rest#*:}"
            base_arg=()
            [ -n "$base" ] && base_arg=(--build-arg "RUNTIME_BASE=${base}")
            docker buildx build \
              --platform "$plat" \
              "${base_arg[@]}" \
              --tag "${image}:${version}" \
              --output "type=docker,dest=images/subnetra-image-${version}-${arch}.tar" \
              .
            gzip -9 "images/subnetra-image-${version}-${arch}.tar"
          done
          ls -l images

      - name: Upload offline image artifacts
        uses: actions/upload-artifact@v5
        with:
          name: subnetra-images
          path: images/*.tar.gz
          retention-days: 1
